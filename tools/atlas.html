<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fogvale atlas generator</title>
<style>body{background:#20222c;color:#ddd;font-family:monospace} canvas{image-rendering:pixelated;display:block;margin:12px 0;background:#141620}</style>
</head>
<body>
<h3>atlas (6x)</h3>
<canvas id="zoom"></canvas>
<h3>sample scene (5x)</h3>
<canvas id="scene"></canvas>
<canvas id="atlas" style="display:none"></canvas>
<script>
'use strict';
/* Authors every Fogvale tile as code-defined 16x16 pixel art and bakes the
   spritesheet consumed by index.html.  Export with tools/make-atlas.mjs.
   The NAMES order below defines atlas cell positions; index.html carries an
   identical copy (ATLAS_NAMES) — make-atlas.mjs fails the export if they drift. */

const CELL = 16, COLS = 8, ROWS = 6;
const NAMES = [
  'grass0','grass1','grass2','tree','mtn0','mtn1','waterA','waterB',
  'shoreN','shoreE','shoreS','shoreW','bridge','wall','floor','doorC',
  'doorO','shrine','herb','mushroom','body','player0','player1','player2',
  'road0','road1','road2','road3','road4','road5','road6','road7',
  'road8','road9','road10','road11','road12','road13','road14','road15',
  'npc0','npc1','npc2','npc3','npc4','npc5','npc6','npc7'
];
/* must match the npc definitions' c: values in index.html, in order:
   maren, tobin, col, bren, yseult, serra, dag, malvo */
const NPC_COLORS = ['#b8c4e8','#d8b47e','#8a7f6a','#9aa5b8','#c9a8d8','#d89a7e','#b89a78','#e8d454'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const atlas = document.getElementById('atlas');
atlas.width = COLS*CELL; atlas.height = ROWS*CELL;
const ctx = atlas.getContext('2d');

function inCell(name, fn){
  const i = NAMES.indexOf(name);
  if(i < 0) throw new Error('unknown cell '+name);
  ctx.save();
  ctx.translate((i%COLS)*CELL, Math.floor(i/COLS)*CELL);
  fn();
  ctx.restore();
}
function px(x,y,c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1); }
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
/* string-map renderer: 16 rows of 16 chars, '.' = transparent */
function sm(rows, pal){
  rows.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      const c = pal[row[x]];
      if(c) px(x,y,c);
    }
  });
}
function shade(hex, f){ // f<1 darkens, f>1 lightens
  const n = parseInt(hex.slice(1),16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n>>s)&255)*f)));
  return '#'+[16,8,0].map(s=>ch(s).toString(16).padStart(2,'0')).join('');
}

/* ---------------- terrain ---------------- */
const G = { base:'#3a6835', dark:'#345c2e', light:'#45753b', blade:'#538547' };
function grassTile(seed, tint){
  rect(0,0,16,16, tint||G.base);
  const r = mulberry32(seed);
  for(let i=0;i<20;i++) px(r()*16|0, r()*16|0, r()<.55?G.dark:G.light);
  for(let i=0;i<5;i++){ const x=1+r()*14|0, y=2+r()*13|0; px(x,y,G.light); px(x,y-1,G.blade); }
}
inCell('grass0', ()=>grassTile(11, '#3a6835'));
inCell('grass1', ()=>grassTile(23, '#376231'));
inCell('grass2', ()=>grassTile(47, '#3d6c37'));

inCell('tree', ()=>sm([
  '.....aaaaa......',
  '....abbbbba.....',
  '...abbcbbcba....',
  '..abbcccbccba...',
  '..abccccccbba...',
  '.abbcbbccccbba..',
  '.abcccccbbccba..',
  '.abbccbcccbbba..',
  '..abbbccbbbba...',
  '...abbabbbaa....',
  '....aa.tu.a.....',
  '.......tu.......',
  '.......tu.......',
  '......stuss.....',
  '....sssssss.....',
  '................',
],{ a:'#1c3f1e', b:'#2a5c2a', c:'#3d7a3e', t:'#4a3620', u:'#5d4527', s:'rgba(10,14,10,.35)' }));

function mtnTile(seed){
  // boulder mass: rounded rocks lit from top-left, dark crevices between
  rect(0,0,16,16,'#3f3c4b');
  const r = mulberry32(seed);
  const blobs = [];
  for(let i=0;i<5;i++) blobs.push([1+(r()*13|0), 1+(r()*13|0), 2+(r()*2|0)]);
  for(const [bx,by,br] of blobs){
    for(let dy=-br;dy<=br;dy++)for(let dx=-br;dx<=br;dx++){
      const x=bx+dx, y=by+dy;
      if(x<0||y<0||x>15||y>15) continue;
      const d=dx*dx+dy*dy;
      if(d<=br*br) px(x,y, (dx+dy<-(br>>1)) ? '#7b7889' : d<=(br-1)*(br-1) ? '#635f70' : '#524f5f');
    }
    if(bx>0&&by>0) px(bx-1,by-1,'#8d8a9a');
  }
  for(let i=0;i<12;i++) px(r()*16|0, r()*16|0, r()<.5?'#35323f':'#57545f');
}
inCell('mtn0', ()=>mtnTile(5));
inCell('mtn1', ()=>mtnTile(91));

function waterTile(frame){
  rect(0,0,16,16,'#27508f');
  const r = mulberry32(300+frame*0);          // same blobs both frames
  for(let i=0;i<5;i++){ const x=r()*13|0, y=r()*13|0; rect(x,y,2+(r()*2|0),2,'#1d3f75'); }
  // ripple dashes shift between frames
  const rows = frame===0 ? [3,8,13] : [5,10,15];
  const r2 = mulberry32(77+frame);
  for(const y of rows){
    let x = r2()*4|0;
    while(x<15){ const len=2+(r2()*3|0); rect(x,y%16,Math.min(len,16-x),1,'#3a6ab0'); x+=len+2+(r2()*4|0); }
  }
  px(r2()*16|0, r2()*16|0, '#5b8cd0'); px(r2()*16|0, r2()*16|0, '#5b8cd0');
}
inCell('waterA', ()=>waterTile(0));
inCell('waterB', ()=>waterTile(1));

/* foam overlays where water meets land */
const FOAM1='rgba(225,238,255,.8)', FOAM2='rgba(150,190,235,.45)';
inCell('shoreN', ()=>{ const r=mulberry32(1); for(let x=0;x<16;x++){ if(r()<.8)px(x,0,FOAM1); if(r()<.4)px(x,1,FOAM2); } });
inCell('shoreS', ()=>{ const r=mulberry32(2); for(let x=0;x<16;x++){ if(r()<.8)px(x,15,FOAM1); if(r()<.4)px(x,14,FOAM2); } });
inCell('shoreW', ()=>{ const r=mulberry32(3); for(let y=0;y<16;y++){ if(r()<.8)px(0,y,FOAM1); if(r()<.4)px(1,y,FOAM2); } });
inCell('shoreE', ()=>{ const r=mulberry32(4); for(let y=0;y<16;y++){ if(r()<.8)px(15,y,FOAM1); if(r()<.4)px(14,y,FOAM2); } });

/* roads: 16 autotile variants, bit mask N=1 E=2 S=4 W=8; grass shows at
   unconnected sides so lone stubs still read as a worn patch */
const D = { edge:'#6e5c3c', dark:'#8a7550', base:'#9d8a60', light:'#b3a071' };
for(let mask=0; mask<16; mask++){
  inCell('road'+mask, ()=>{
    grassTile(200+mask);
    const r = mulberry32(60+mask);
    const on = b => (mask&b)!==0;
    // center pad
    rect(3,3,10,10,D.base);
    if(on(1)) rect(3,0,10,4,D.base);
    if(on(4)) rect(3,12,10,4,D.base);
    if(on(8)) rect(0,3,4,10,D.base);
    if(on(2)) rect(12,3,4,10,D.base);
    if(!mask) rect(4,4,8,8,D.base);
    // rounded corners toward grass
    const cornerHole = (x,y)=>{ px(x,y,G.base); };
    if(!on(1)&&!on(8)) cornerHole(3,3);
    if(!on(1)&&!on(2)) cornerHole(12,3);
    if(!on(4)&&!on(8)) cornerHole(3,12);
    if(!on(4)&&!on(2)) cornerHole(12,12);
    // texture: ruts + pebbles + edge darkening
    for(let i=0;i<16;i++){ const x=r()*16|0, y=r()*16|0;
      if(insideRoad(x,y,mask)) px(x,y, r()<.5?D.dark:D.light); }
    edgeShade(mask);
  });
}
function insideRoad(x,y,mask){
  const on=b=>(mask&b)!==0;
  if(x>=3&&x<13&&y>=3&&y<13) return true;
  if(on(1)&&x>=3&&x<13&&y<3) return true;
  if(on(4)&&x>=3&&x<13&&y>=13) return true;
  if(on(8)&&x<3&&y>=3&&y<13) return true;
  if(on(2)&&x>=13&&y>=3&&y<13) return true;
  return false;
}
function edgeShade(mask){
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(!insideRoad(x,y,mask)) continue;
    const nbr = [[0,-1],[1,0],[0,1],[-1,0]].some(([ax,ay])=>{
      const nx=x+ax, ny=y+ay;
      if(nx<0||ny<0||nx>15||ny>15) return false; // tile continues into neighbor
      return !insideRoad(nx,ny,mask);
    });
    if(nbr) px(x,y,D.edge);
  }
}

inCell('bridge', ()=>{
  // planks run north-south (crossing an east-west road); rails top & bottom
  rect(0,0,16,16,'#7a5c3a');
  for(let x=2;x<16;x+=3) rect(x,0,1,16,'#5d4227');           // plank seams
  const r = mulberry32(31);
  for(let i=0;i<12;i++) px(r()*16|0, 3+(r()*10|0), r()<.5?'#8f6e46':'#6b4e30');
  rect(0,0,16,2,'#4a3620'); rect(0,14,16,2,'#4a3620');       // rails
  rect(0,0,16,1,'#5d4227'); rect(0,15,16,1,'#332412');
  for(let x=1;x<16;x+=5){ rect(x,0,1,3,'#241a10'); rect(x,13,1,3,'#241a10'); }
});

inCell('wall', ()=>{
  // lighter cap (rows 0-4) over a stone-brick face with mortar courses
  rect(0,0,16,16,'#453e56');
  rect(0,0,16,1,'#736c8a');
  rect(0,1,16,4,'#575068');
  rect(0,4,16,1,'#332d40');
  for(let y=5;y<16;y+=4) rect(0,y,16,1,'#2a2434');
  for(let y=5;y<16;y+=4){
    const off = (y/4)%2 ? 4 : 0;
    for(let x=off;x<16;x+=8) rect(x,y+1,1,3,'#2a2434');
  }
  const r=mulberry32(8);
  for(let i=0;i<14;i++){ const x=r()*16|0, y=6+(r()*9|0); px(x,y, r()<.5?'#4f4762':'#3b3449'); }
  for(let x=0;x<16;x+=4) px(x+1,2,'#665e7c');
});

inCell('floor', ()=>{
  rect(0,0,16,16,'#6b5233');
  for(let y=3;y<16;y+=4) rect(0,y,16,1,'#54401f');
  const r=mulberry32(15);
  for(let i=0;i<12;i++){ const x=r()*14|0, y=r()*16|0; rect(x,y,1+(r()*2|0),1, r()<.5?'#5d4527':'#7d6240'); }
  px(3,1,'#4a3620'); px(11,6,'#4a3620'); px(6,13,'#4a3620');
});

inCell('doorC', ()=>sm([
  'WWWWWWWWWWWWWWWW',
  'WwwwwwwwwwwwwwwW',
  'Wwaddddddddda wW'.replace(' ','w'),
  'WwadddddddddawwW',
  'WwaddeddeddawwwW'.slice(0,16),
  'WwadddddddddawwW',
  'WwadddddddddawwW',
  'Wwaddeddeddda wW'.replace(' ','w'),
  'WwadddddddkdawwW',
  'WwadddddddddawwW',
  'WwadddddddddawwW',
  'WwaddeddeddawwwW'.slice(0,16),
  'WwadddddddddawwW',
  'WwadddddddddawwW',
  'WwwwwwwwwwwwwwwW',
  'WWWWWWWWWWWWWWWW',
],{ W:'#2c2736', w:'#4a4459', a:'#4a3620', d:'#8a6234', e:'#6b4a26', k:'#e8c454' }));

inCell('doorO', ()=>sm([
  'WWWWWWWWWWWWWWWW',
  'WwwwwwwwwwwwwwwW',
  'Wwa.........awwW'.replace(/\./g,'o'),
  'WwaooooooooOawwW',
  'WwaoooooooooawwW',
  'WwaoOoooooooawwW',
  'WwaoooooooooawwW',
  'WwaooooooOooawwW',
  'WwaoooooooooawwW',
  'WwaoooooooooawwW',
  'WwaooOooooooawwW',
  'WwaoooooooooawwW',
  'WwaoooooooOoawwW',
  'WwaoooooooooawwW',
  'WwwwwwwwwwwwwwwW',
  'WWWWWWWWWWWWWWWW',
],{ W:'#2c2736', w:'#4a4459', a:'#4a3620', o:'#241a10', O:'#33261a' }));

inCell('shrine', ()=>sm([
  '................',
  '.....pqqp.......',
  '....pqrrqp......',
  '...pqrrrrqp.....',
  '...qrrggrrq.....',
  '...qrg..grq.....',
  '...qrrggrrq.....',
  '...qgrggrgq.....',
  '...qg.qq.gq.....',
  '...qgrggrgq.....',
  '...qqrggrqq.....',
  '...pqrrrrqp.....',
  '...vqrrrrqv.....',
  '..vvpqqqqpvv....',
  '..svvvvvvvvs....',
  '...ssssssss.....',
],{ p:'#7d838c', q:'#9aa0a8', r:'#b4bac2', g:'#c9b96a', v:'#3f6b38', s:'rgba(10,14,10,.35)' }));

/* ---------------- objects ---------------- */
inCell('herb', ()=>sm([
  '................','................','................','................',
  '................','......g.........','...g..g...g.....','...dg.g..gd.....',
  '....d.g.gd......','.....dgd........','......d.........','......d.........',
  '......d.........','................','................','................',
],{ g:'#7dd870', d:'#4da648' }));

inCell('mushroom', ()=>sm([
  '................','................','................','................',
  '.....bbbb.......','....bllbbb......','...bllbbbbb.....','...bbbbbbdb.....',
  '...dbbbbbdd.....','.....wwww.......','.....weww.......','.....weww.......',
  '.....wwww.......','....swwwws......','................','................',
],{ b:'#4a7ec9', l:'#6b9ad9', d:'#3a63a3', w:'#e8e2d0', e:'#c9c2ae', s:'rgba(10,14,10,.3)' }));

inCell('body', ()=>sm([
  '................','................','................','................',
  '....cccccc......','...cddccccc.....','..cdcccccccc....','..ccccdcccccc...',
  '..cccccccdccc...','..cdccccccccc...','...cccdcccc.....','....cccccc......',
  '.....ssss.......','................','................','................',
],{ c:'#cfc8b2', d:'#a8a18c', s:'rgba(10,14,10,.3)' }));

/* ---------------- people (16x16, facing right; runtime flips for left) --- */
function person(cloak, opts){
  const C = cloak, Cd = shade(cloak,.62), Cl = shade(cloak,1.22);
  const skin = opts.skin||'#e0c09a', skind = shade(skin,.72);
  const hair = opts.hair||'#5a4630';
  const pal = { h:hair, k:skin, K:skind, e:'#241c14', c:C, C:Cd, L:Cl,
                b:'#3a2e1c', s:'rgba(10,14,10,.35)' };
  const rows = opts.hood ? [
    '.....CCCC.......',
    '....CccccC......',
    '....Cckkkc......',
    '....CckekC......',
    '....CckkkC......',
    '....cccccc......',
    '...LccccccC.....',
    '...CccccccC.....',
    '...CccccccC.....',
    '...CccccccC.....',
    '...CccccccC.....',
    '...CccccccC.....',
    '...CccccccC.....',
    '...CCCCCCCC.....',
    '..sCCCCCCCCs....',
    '...ssssssss.....',
  ] : [
    '................',
    '.....hhhh.......',
    '....hhhhhh......',
    '....hkkkkh......',
    '....hkekek......',
    '.....kkkk.......',
    '....LccccC......',
    '...LccccccC.....',
    '...CccccccC.....',
    '...CccccccC.....',
    '....cccccC......',
    '....cc..cc......',
    walkRow(opts.frame,0),
    walkRow(opts.frame,1),
    '................',
    '....ssssss......',
  ];
  sm(rows, pal);
}
function walkRow(frame,row){ // simple 2-frame gait, legs as 'b' boots
  if(frame===1) return row===0 ? '...bb...bb......' : '..bb.....bb.....';
  if(frame===2) return row===0 ? '.....bbbb.......' : '.....bb.bb......';
  return row===0 ? '....bb..bb......' : '....bb..bb......';
}
inCell('player0', ()=>person('#5a7ec9',{frame:0, skin:'#f2d5b0'}));
inCell('player1', ()=>person('#5a7ec9',{frame:1, skin:'#f2d5b0'}));
inCell('player2', ()=>person('#5a7ec9',{frame:2, skin:'#f2d5b0'}));
NPC_COLORS.forEach((c,i)=> inCell('npc'+i, ()=>person(c,{hood:true})) );

/* ---------------- previews ---------------- */
const Z=6, zoom=document.getElementById('zoom');
zoom.width=atlas.width*Z; zoom.height=atlas.height*Z;
const zctx=zoom.getContext('2d'); zctx.imageSmoothingEnabled=false;
zctx.drawImage(atlas,0,0,zoom.width,zoom.height);
zctx.strokeStyle='rgba(255,255,255,.15)';
for(let x=0;x<=COLS;x++){ zctx.beginPath(); zctx.moveTo(x*CELL*Z,0); zctx.lineTo(x*CELL*Z,zoom.height); zctx.stroke(); }
for(let y=0;y<=ROWS;y++){ zctx.beginPath(); zctx.moveTo(0,y*CELL*Z); zctx.lineTo(zoom.width,y*CELL*Z); zctx.stroke(); }

/* small mock scene to judge cohesion: grass, road cross, river+bridge, town corner */
const SC=[
  'g g t w g g g g'.split(' '),
  'g r r b r r r g'.split(' '),  // horizontal road over bridge
  't g r w g W W W'.split(' '),  // W = wall
  'g g r w g W f D'.split(' '),  // D = door
  'g t r w g W f W'.split(' '),
  'g g r w g W W W'.split(' '),
].map(r=>r.filter(s=>s));
const scene=document.getElementById('scene'); const SZ=5;
scene.width=SC[0].length*CELL*SZ; scene.height=SC.length*CELL*SZ;
const sctx=scene.getContext('2d'); sctx.imageSmoothingEnabled=false;
function blit(name, tx, ty){
  const i=NAMES.indexOf(name);
  sctx.drawImage(atlas,(i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL, tx*CELL*SZ,ty*CELL*SZ,CELL*SZ,CELL*SZ);
}
SC.forEach((row,y)=>row.forEach((c,x)=>{
  const at=(ax,ay)=> (SC[ay]&&SC[ay][ax])||'g';
  if(c==='g'||c==='t'){ blit('grass'+((x*7+y*13)%3),x,y); if(c==='t') blit('tree',x,y); }
  else if(c==='w'||c==='b'){
    blit('waterA',x,y);
    const land=v=>v!=='w'&&v!=='b';
    if(land(at(x,y-1))) blit('shoreN',x,y);
    if(land(at(x,y+1))) blit('shoreS',x,y);
    if(land(at(x-1,y))) blit('shoreW',x,y);
    if(land(at(x+1,y))) blit('shoreE',x,y);
    if(c==='b') blit('bridge',x,y);
  }
  else if(c==='r'){
    const road=v=>v==='r'||v==='b';
    const mask=(road(at(x,y-1))?1:0)|(road(at(x+1,y))?2:0)|(road(at(x,y+1))?4:0)|(road(at(x-1,y))?8:0);
    blit('road'+mask,x,y);
  }
  else if(c==='W') blit('wall',x,y);
  else if(c==='f') blit('floor',x,y);
  else if(c==='D') blit('doorC',x,y);
}));
blit('player0',1,0); blit('npc0',6,4); blit('herb',0,3); blit('mushroom',4,0); blit('shrine',7,0);

window.__atlasDataURL = atlas.toDataURL('image/png');
window.__atlasReady = true;
</script>
</body>
</html>
