<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fogvale atlas compositor</title>
<style>body{background:#20222c;color:#ddd;font-family:monospace} canvas{image-rendering:pixelated;display:block;margin:12px 0;background:#141620} .lbl{color:#9ad}</style>
</head>
<body>
<h3>atlas (5x)</h3>
<canvas id="zoom"></canvas>
<h3>sample scene (4x)</h3>
<canvas id="scene"></canvas>
<canvas id="atlas" style="display:none"></canvas>
<script>
'use strict';
/* Composites assets/tiles.png from the CC0 "Zelda-like tilesets and sprites"
   pack by ArMM1998 (opengameart.org/content/zelda-like-tilesets-and-sprites),
   sources in tools/src/.  A few small sprites (herb, mushroom, body) stay
   hand-authored.  Serve over http (make-atlas.mjs does) — canvas pixel access
   is needed for recoloring and file:// would taint it.

   The ATLAS_DEF block is copied verbatim into index.html; make-atlas.mjs
   fails the export if the two copies drift. */

/*ATLAS_DEF_START*/
const ATLAS_DEF = (()=>{
  const d = {
    grass0:[0,0,16,16], grass1:[16,0,16,16], grass2:[32,0,16,16], tree:[48,0,16,16],
    mtn0:[64,0,16,16], mtn1:[80,0,16,16], waterA:[96,0,16,16], waterB:[112,0,16,16],
    shoreN:[0,16,16,16], shoreE:[16,16,16,16], shoreS:[32,16,16,16], shoreW:[48,16,16,16],
    bridge:[64,16,16,16], wall:[80,16,16,16], floor:[96,16,16,16], doorC:[112,16,16,16],
    doorO:[0,32,16,16], shrine:[16,32,16,16], herb:[32,32,16,16], mushroom:[48,32,16,16],
    body:[64,32,16,16],
    road0:[0,48,16,16], road1:[16,48,16,16], road2:[32,48,16,16], road3:[48,48,16,16],
    road4:[64,48,16,16], road5:[80,48,16,16], road6:[96,48,16,16], road7:[112,48,16,16],
    road8:[0,64,16,16], road9:[16,64,16,16], road10:[32,64,16,16], road11:[48,64,16,16],
    road12:[64,64,16,16], road13:[80,64,16,16], road14:[96,64,16,16], road15:[112,64,16,16]
  };
  /* tall 16x24 cells packed from y=80: player frames, the tree, then
     9 frames per NPC (D/L/U directions x idle,walkA,walkB) */
  const FR = ['D0','D1','D2','L0','L1','L2','U0','U1','U2'];
  let i = 0;
  const cell = ()=>{ const x=(i%8)*16, y=80+((i/8)|0)*24; i++; return [x,y,16,24]; };
  for(const f of FR) d['player'+f] = cell();
  d.tree2 = cell(); d.tower = cell(); d.altar = cell();
  for(let n=0;n<8;n++) for(const f of FR) d['npc'+n+f] = cell();
  d.cave = [80,32,16,16];
  return d;
})();
/*ATLAS_DEF_END*/

/* must match the npc definitions' c: values in index.html, in order:
   maren, tobin, col, bren, yseult, serra, dag, malvo */
const NPC_COLORS = ['#b8c4e8','#d8b47e','#8a7f6a','#9aa5b8','#c9a8d8','#d89a7e','#b89a78','#e8d454'];

const atlas = document.getElementById('atlas');
atlas.width = 128; atlas.height = 344;
const ctx = atlas.getContext('2d');

const OW = new Image(), CH = new Image();
let loaded = 0;
OW.onload = CH.onload = () => { if(++loaded === 2) build(); };
OW.onerror = CH.onerror = () => { document.title = 'load-error'; };
OW.src = 'src/Overworld.png';
CH.src = 'src/character.png';

function at(name){ return ATLAS_DEF[name]; }
/* copy a source rect (tile coords ×16 unless px given) into an atlas cell */
function put(img, sx, sy, name, opts={}){
  const [dx,dy,w,h] = at(name);
  const sw = opts.sw||w, sh = opts.sh||h;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, sx, sy, sw, sh, dx+(opts.ox||0), dy+(opts.oy||0), opts.dw||w, opts.dh||h);
}
function px(x,y,c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1); }
function sm(name, rows, pal){
  const [dx,dy] = at(name);
  rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const c=pal[row[x]]; if(c) px(dx+x,dy+y,c); } });
}

function build(){
/* ---------------- terrain from the Overworld sheet ----------------------- */
const T = n => n*16;

/* scratch canvas for sampling pack pixels */
const scr = document.createElement('canvas');
scr.width = OW.width; scr.height = OW.height;
const sctx = scr.getContext('2d');
sctx.drawImage(OW, 0, 0);
const sample = (x,y) => {
  const d = sctx.getImageData(x,y,1,1).data;
  return 'rgb('+d[0]+','+d[1]+','+d[2]+')';
};

// grass: audited fills with no dirt edges / saplings / moss baked in
// (see test/out/grass-audit.html for the survey that picked these)
put(OW, T(0), T(0),  'grass0');
put(OW, T(5), T(9),  'grass1');
put(OW, T(5), T(10), 'grass2');

// tree: the big round tree at (5,16)-(7,18), 32x48 crop scaled 2:1 → 16x24 tall
// sprite; the crop's top-left corner catches a neighboring bush — blank it
put(OW, 80, 244, 'tree2', { sw:32, sh:48 });
{ const [tx,ty] = at('tree2'); ctx.clearRect(tx,ty,8,5); }
// legacy 16x16 slot keeps a canopy crop as fallback (unused by the game)
put(OW, 88, 260, 'tree');

// mountains: brown cliff-rock faces (picked clear of waterfall edges)
put(OW, T(4), T(13), 'mtn0');
put(OW, T(5), T(14), 'mtn1');

// water: procedural fill in the pack's own colors (no plain 16x16 exists in
// the sheet).  Locate the pond by scanning for its blues instead of trusting
// hand-read coordinates — foam is the lightest pixel in the same window.
let pond={x:56,y:155}, best=-1, foam={x:50,y:146}, bestL=1e9, top=145,bot=166,left=46,right=66;
{
  const win = sctx.getImageData(30,135,60,45).data;
  let minX=99,maxX=0,minY=99,maxY=0;
  for(let yy=0;yy<45;yy++)for(let xx=0;xx<60;xx++){
    const i=(yy*60+xx)*4, r=win[i],g=win[i+1],b=win[i+2];
    if(win[i+3]>0 && b>r+30 && b>g+20){
      if(b-((r+g)>>1) > best){ best=b-((r+g)>>1); pond={x:30+xx,y:135+yy}; }
      minX=Math.min(minX,xx); maxX=Math.max(maxX,xx);
      minY=Math.min(minY,yy); maxY=Math.max(maxY,yy);
    }
    if(win[i+3]>0 && r>200&&g>200&&b>200 && r+g+b<bestL*3+765 ){ foam={x:30+xx,y:135+yy}; bestL=0; }
  }
  left=30+minX; right=30+maxX; top=135+minY; bot=135+maxY;
}
const WBASE = sample(pond.x,pond.y), WDEEP = sample(pond.x,pond.y+1), WFOAM = sample(foam.x,foam.y);
for(const [name,seed] of [['waterA',3],['waterB',11]]){
  const [dx,dy] = at(name);
  ctx.fillStyle = WBASE; ctx.fillRect(dx,dy,16,16);
  let s = seed;
  const rnd = () => (s = (s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<3;i++){ const x=1+rnd()*12|0, y=1+rnd()*13|0;
    ctx.fillStyle=WFOAM; ctx.fillRect(dx+x,dy+y,2,1); ctx.fillRect(dx+x-1,dy+y+1,1,1);
    ctx.fillStyle=WDEEP; ctx.fillRect(dx+x,dy+y+1,2,1); }
}

// shore foam: straight 8px segments from the pond's actual edge bands, tiled x2
{
  const cx = ((left+right)>>1)-4, cy = ((top+bot)>>1)-4;
  for(const [name,sx,sy,w,h,ox,oy] of [
    ['shoreN',cx,top-2,8,6,0,0], ['shoreS',cx,bot-3,8,6,0,10],
    ['shoreW',left-2,cy,6,8,0,0], ['shoreE',right-3,cy,6,8,10,0],
  ]){
    const [dx,dy] = at(name);
    ctx.imageSmoothingEnabled = false;
    if(w===8){ ctx.drawImage(OW,sx,sy,w,h,dx,dy+oy,8,h); ctx.drawImage(OW,sx,sy,w,h,dx+8,dy+oy,8,h); }
    else     { ctx.drawImage(OW,sx,sy,w,h,dx+ox,dy,w,8); ctx.drawImage(OW,sx,sy,w,h,dx+ox,dy+8,w,8); }
  }
}

// bridge: railed platform planks; floor: plain platform planks
put(OW, 152, 112, 'bridge');
put(OW, 98, 112, 'floor');

// wall: tower stone courses
put(OW, T(1), T(24), 'wall');

// doors: castle wooden door leaf (closed), dark tunnel mouth (open)
put(OW, 78, 518, 'doorC');
put(OW, 168, 514, 'doorO');

// shrine: columned monument at (7,22) 2x2, downscaled 2:1
put(OW, T(7), T(22), 'shrine', { sw:32, sh:32 });

// watchtower: the round stone tower (48x72 crop) downscaled 3:1 → 16x24
put(OW, 4, 340, 'tower', { sw:48, sh:72 });
// altar: the stone statue downscaled 2:1 → 16x24
put(OW, 116, 498, 'altar', { sw:32, sh:48 });
// cave mouth: dark arch from the cliff-face cave entrances
put(OW, T(17), T(4)+8, 'cave');

/* ---------------- roads: autotile shapes filled with pack dirt ----------- */
const DIRT_X = T(2), DIRT_Y = T(32);              // plain dirt fill tile
const dirtDark = sample(DIRT_X+3, DIRT_Y+6);
function roadShape(mask,x,y){
  const on = b => (mask&b)!==0;
  if(x>=3&&x<13&&y>=3&&y<13){
    // rounded corners toward grass
    if(!on(1)&&!on(8)&&x<5&&y<5&&(x-4)*(x-4)+(y-4)*(y-4)>4) return false;
    if(!on(1)&&!on(2)&&x>10&&y<5&&(x-11)*(x-11)+(y-4)*(y-4)>4) return false;
    if(!on(4)&&!on(8)&&x<5&&y>10&&(x-4)*(x-4)+(y-11)*(y-11)>4) return false;
    if(!on(4)&&!on(2)&&x>10&&y>10&&(x-11)*(x-11)+(y-11)*(y-11)>4) return false;
    return true;
  }
  if(on(1)&&x>=3&&x<13&&y<3) return true;
  if(on(4)&&x>=3&&x<13&&y>=13) return true;
  if(on(8)&&x<3&&y>=3&&y<13) return true;
  if(on(2)&&x>=13&&y>=3&&y<13) return true;
  return false;
}
for(let mask=0; mask<16; mask++){
  const [dx,dy] = at('road'+mask);
  // grass base
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(OW, T(5), T(9), 16, 16, dx, dy, 16, 16);
  // dirt where the shape says so
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(!roadShape(mask,x,y)) continue;
    ctx.drawImage(OW, DIRT_X+x, DIRT_Y+y, 1, 1, dx+x, dy+y, 1, 1);
  }
  // inner edge shading where dirt meets grass
  ctx.fillStyle = dirtDark;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(!roadShape(mask,x,y)) continue;
    const edge = [[0,-1],[1,0],[0,1],[-1,0]].some(([ax,ay])=>{
      const nx=x+ax, ny=y+ay;
      if(nx<0||ny<0||nx>15||ny>15) return false;   // continues into neighbor tile
      return !roadShape(mask,nx,ny);
    });
    if(edge) ctx.fillRect(dx+x,dy+y,1,1);
  }
}

/* ---------------- people: hero frames, cropped 16x24, NPCs recolored ----- */
/* character.png frames are 16x32; the figure lives in the lower ~24px.
   Row groups: y=0 walk down · y=64 left profile · y=128 walk up (back view).
   Right-facing is the left profile flipped at draw time. */
const CROP_Y = 8;
/* band layout (verified in test/out/band-audit.html): y=0 front, y=32 left
   profile, y=64 back view, y=96 second profile, y=128+ sword attacks */
const DIR_SY = { D:0, L:32, U:64 };
const FRAME_SX = { D:[0,16,48], L:[0,16,48], U:[0,16,48] };
for(const dch of ['D','L','U']) for(const f of [0,1,2]){
  put(CH, FRAME_SX[dch][f], DIR_SY[dch]+CROP_Y, 'player'+dch+f, { sh:24 });
  for(let n=0;n<8;n++)
    put(CH, FRAME_SX[dch][f], DIR_SY[dch]+CROP_Y, 'npc'+n+dch+f, { sh:24 });
}

/* recolor npc shirts: strong-red pixels → the npc's robe color */
function hex(c){ const n=parseInt(c.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
for(let i=0;i<NPC_COLORS.length;i++){
  const [tr,tg,tb] = hex(NPC_COLORS[i]);
  for(const dch of ['D','L','U']) for(const f of [0,1,2]){
    const [dx,dy,w,h] = at('npc'+i+dch+f);
    const d = ctx.getImageData(dx,dy,w,h);
    for(let p=0;p<d.data.length;p+=4){
      const r=d.data[p], g=d.data[p+1], b=d.data[p+2];
      if(d.data[p+3]>0 && r>90 && g<95 && b<95 && r>g*1.55 && r>b*1.55){
        const lum = Math.min(1.25, r/180);
        d.data[p]  =Math.min(255, tr*lum);
        d.data[p+1]=Math.min(255, tg*lum);
        d.data[p+2]=Math.min(255, tb*lum);
      }
    }
    ctx.putImageData(d,dx,dy);
  }
}

/* ---------------- small sprites ------------------------------------------ */
// herb: the pack's white wortleaf-ish flower cluster (transparent bg)
put(OW, T(0), T(8), 'herb');
sm('mushroom',[
  '................','................','................','................',
  '.....bbbb.......','....bllbbb......','...bllbbbbb.....','...bbbbbbdb.....',
  '...dbbbbbdd.....','.....wwww.......','.....weww.......','.....weww.......',
  '.....wwww.......','....swwwws......','................','................',
],{ b:'#4a7ec9', l:'#6b9ad9', d:'#3a63a3', w:'#e8e2d0', e:'#c9c2ae', s:'rgba(10,14,10,.3)' });
sm('body',[
  '................','................','................','................',
  '....cccccc......','...cddccccc.....','..cdcccccccc....','..ccccdcccccc...',
  '..cccccccdccc...','..cdccccccccc...','...cccdcccc.....','....cccccc......',
  '.....ssss.......','................','................','................',
],{ c:'#cfc8b2', d:'#a8a18c', s:'rgba(10,14,10,.3)' });

preview();
window.__atlasDataURL = atlas.toDataURL('image/png');
window.__atlasReady = true;
document.title = 'ready';
}

/* ---------------- previews ---------------------------------------------- */
function preview(){
  const Z=5, zoom=document.getElementById('zoom');
  zoom.width=atlas.width*Z; zoom.height=atlas.height*Z;
  const z=zoom.getContext('2d'); z.imageSmoothingEnabled=false;
  z.drawImage(atlas,0,0,zoom.width,zoom.height);
  z.strokeStyle='rgba(255,255,255,.18)';
  for(let x=0;x<=atlas.width;x+=16){ z.beginPath(); z.moveTo(x*Z,0); z.lineTo(x*Z,zoom.height); z.stroke(); }
  for(let y=0;y<=atlas.height;y+=16){ z.beginPath(); z.moveTo(0,y*Z); z.lineTo(zoom.width,y*Z); z.stroke(); }

  const SC=[
    'g g t t w g g g'.split(' '),
    'g r r b r r r g'.split(' '),
    't g r w g W W W'.split(' '),
    'g t r w g W f D'.split(' '),
    'g g r w g W f W'.split(' '),
    'g g r w g W W W'.split(' '),
  ];
  const scene=document.getElementById('scene'); const SZ=4, CS=16;
  scene.width=SC[0].length*CS*SZ; scene.height=SC.length*CS*SZ;
  const s=scene.getContext('2d'); s.imageSmoothingEnabled=false;
  function blit(name,tx,ty,feet){
    const [x,y,w,h]=ATLAS_DEF[name];
    const oy = feet ? (h-16) : 0;
    s.drawImage(atlas,x,y,w,h, tx*CS*SZ, (ty*CS-oy)*SZ, w*SZ, h*SZ);
  }
  SC.forEach((row,y)=>row.forEach((c,x)=>{
    const atv=(ax,ay)=> (SC[ay]&&SC[ay][ax])||'g';
    if(c==='g'||c==='t'){ blit('grass'+((x*7+y*13)%3),x,y); if(c==='t') blit('tree2',x,y,true); }
    else if(c==='w'||c==='b'){
      blit('waterA',x,y);
      const land=v=>v!=='w'&&v!=='b';
      if(land(atv(x,y-1))) blit('shoreN',x,y);
      if(land(atv(x,y+1))) blit('shoreS',x,y);
      if(land(atv(x-1,y))) blit('shoreW',x,y);
      if(land(atv(x+1,y))) blit('shoreE',x,y);
      if(c==='b') blit('bridge',x,y);
    }
    else if(c==='r'){
      const road=v=>v==='r'||v==='b';
      const mask=(road(atv(x,y-1))?1:0)|(road(atv(x+1,y))?2:0)|(road(atv(x,y+1))?4:0)|(road(atv(x-1,y))?8:0);
      blit('road'+mask,x,y);
    }
    else if(c==='W') blit('wall',x,y);
    else if(c==='f') blit('floor',x,y);
    else if(c==='D') blit('doorC',x,y);
  }));
  blit('playerL1',1,2,true); blit('npc0D0',6,4,true); blit('npc7L1',5,0,true);
  blit('herb',0,3); blit('mushroom',4,0); blit('shrine',7,2); blit('body',1,4);
}
</script>
</body>
</html>
